name: partner_app
description: "Partner (seller) monitoring app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Routing
  go_router: ^14.2.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Firebase / push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # UI utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
