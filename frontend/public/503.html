<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back — Nawy</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d0f14;
            --surface: #13161e;
            --border:  rgba(255,255,255,.07);
            --accent:  #7c6af7;
            --accent2: #4fd1c5;
            --text:    #e8eaf0;
            --muted:   #7a7f94;
        }

        html, body { height: 100%; background: var(--bg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); overflow: hidden; }

        .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .18; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
        .orb-1 { width: 600px; height: 600px; background: var(--accent);  top: -200px; left: -200px; animation-delay: 0s; }
        .orb-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -150px; animation-delay: -6s; }
        .orb-3 { width: 350px; height: 350px; background: #f687b3; top: 40%; left: 55%; animation-delay: -12s; }

        @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.08); } }

        .grid-overlay { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 60px 60px; }

        .scene { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }

        .icon-wrap { width: 90px; height: 90px; border-radius: 24px; background: linear-gradient(135deg, rgba(124,106,247,.25), rgba(79,209,197,.15)); border: 1px solid rgba(124,106,247,.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; animation: pulse-glow 3s ease-in-out infinite; }
        @keyframes pulse-glow { 0%,100%{box-shadow:0 0 40px rgba(124,106,247,.2)} 50%{box-shadow:0 0 70px rgba(124,106,247,.45)} }
        .icon-wrap svg { width: 42px; height: 42px; }

        .badge { display: inline-flex; align-items: center; gap: .45rem; background: rgba(124,106,247,.12); border: 1px solid rgba(124,106,247,.3); border-radius: 100px; padding: .35rem 1rem; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a99df9; margin-bottom: 1.5rem; }
        .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

        h1 { font-size: clamp(2rem,5vw,3.2rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; background: linear-gradient(135deg, #ffffff 30%, #a99df9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }

        p.sub { font-size: 1.05rem; color: var(--muted); max-width: 440px; line-height: 1.7; margin-bottom: 2.5rem; }

        .progress-wrap { width: 100%; max-width: 360px; height: 4px; border-radius: 99px; background: var(--border); margin: 0 auto 2.5rem; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: progress-slide 3s ease-in-out infinite; transform-origin: left; }
        @keyframes progress-slide { 0%{transform:translateX(-100%) scaleX(.4)} 50%{transform:translateX(0%) scaleX(.6)} 100%{transform:translateX(100%) scaleX(.4)} }

        .cards { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; max-width: 560px; margin-bottom: 3rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.4rem; display: flex; align-items: center; gap: .75rem; font-size: .88rem; color: var(--muted); min-width: 160px; }
        .card-icon { font-size: 1.3rem; }

        footer { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: auto; }
        footer strong { color: var(--text); }

        @media (max-width: 480px) { .cards { flex-direction: column; align-items: center; } }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-overlay"></div>

<div class="scene">

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#7c6af7"/>
                    <stop offset="100%" stop-color="#4fd1c5"/>
                </linearGradient>
            </defs>
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
            <path d="M12 8v4l3 3"/>
        </svg>
    </div>

    <div class="badge">
        <span class="badge-dot"></span>
        Scheduled Maintenance
    </div>

    <h1>We'll Be Right Back</h1>

    <p class="sub">
        Our team is currently performing scheduled maintenance to improve your experience.
        We apologize for any inconvenience and appreciate your patience.
    </p>

    <div class="progress-wrap">
        <div class="progress-bar"></div>
    </div>

    <div class="cards">
        <div class="card">
            <span class="card-icon">⚡</span>
            <span>Back soon &mdash; usually under an hour</span>
        </div>
        <div class="card">
            <span class="card-icon">🔒</span>
            <span>Your data is safe &amp; untouched</span>
        </div>
    </div>

    <footer>
        &copy; <span id="yr"></span> <strong>Nawy</strong> &mdash; All rights reserved.
    </footer>

</div>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
