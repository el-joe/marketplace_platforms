name: delivery_app
description: "Delivery agent app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Firebase / push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # UI utilities
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
