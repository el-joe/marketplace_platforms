name: carrier_app
description: "Carrier (Shipping Supervisor) app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Firebase / push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # UI utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
